name: Backend Deploy

# Chạy khi tạo GitHub Release với tag bắt đầu bằng "backend-v" (VD: backend-v0.1.0).
# Build + push image luôn chạy được qua workflow_dispatch để test mà không cần deploy thật
# (bước SSH deploy chỉ chạy khi có đủ secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy lên server sau khi build? (cần đã cấu hình secrets)"
        type: boolean
        default: false
      reseed:
        description: "[HUỶ DIỆT — KHÔNG DÙNG NỮA KHI ĐÃ CÓ USER THẬT] Xoá sạch DB production (kể cả user thật) và chạy lại prisma/seed.ts. Chỉ chạy khi confirm_reseed khớp."
        type: boolean
        default: false
      confirm_reseed:
        description: "Gõ đúng chữ RESEED để xác nhận (chỉ cần khi reseed=true)"
        type: string
        default: ""
      reseed_testers:
        description: "An toàn hơn: chỉ cập nhật giá 4 trứng thường + xoá/tạo lại NGẪU NHIÊN 10 tester (tester01..10@cozypomo.dev). KHÔNG đụng Species/EggType/user khác (kể cả tài khoản thật)."
        type: boolean
        default: false
      confirm_reseed_testers:
        description: "Gõ đúng chữ RESEED_TESTERS để xác nhận (chỉ cần khi reseed_testers=true)"
        type: string
        default: ""
      patch_content:
        description: "An toàn nhất: chỉ THÊM (không xoá/sửa gì hiện có) — lore 175 loài đang null, 6 vật phẩm BOOST, 7 dòng streak_reward_days rỗng. Không cần gõ xác nhận (chỉ INSERT/UPDATE-nếu-null, không đụng User/Session/Ledger)."
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'backend-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: ${{ github.event_name == 'release' || inputs.deploy == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (docker compose pull && up -d)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  reseed-production:
    # Chạy tay riêng, KHÔNG gắn với release/deploy tự động — xoá sạch user/session/ledger
    # thật trên production rồi seed lại dữ liệu demo (175 loài, 4 loại trứng economy v2,
    # 10 tài khoản tester). CẢNH BÁO (2026-07-27): từ khi có tài khoản thật
    # (nhininh410@gmail.com) trên production, job này sẽ xoá LUÔN cả tài khoản đó — dùng
    # `reseed-testers` bên dưới thay thế trừ khi thật sự cần xoá sạch toàn bộ. Cổng an toàn kép:
    # input `reseed` phải bật VÀ `confirm_reseed` phải gõ đúng "RESEED".
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed == true && inputs.confirm_reseed == 'RESEED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reseed via SSH (cài tạm ts-node/typescript trong container rồi chạy prisma db seed)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            CID=$(docker compose -f docker-compose.prod.yml ps -q api)
            docker exec "$CID" npm install --no-save ts-node typescript
            docker exec "$CID" npx prisma db seed

  reseed-testers:
    # An toàn cho production: KHÔNG xoá Species/EggType/user khác — chỉ cập nhật giá 4 trứng
    # thường (Rừng/Biển/Hoa 300 Xu, Bí Ẩn 450 Xu) rồi xoá + tạo lại NGẪU NHIÊN đúng 10 tài khoản
    # tester (tester01..10@cozypomo.dev). Tài khoản thật (kể cả nhininh410@gmail.com — id/email/
    # password/lịch sử/item) không nằm trong danh sách bị xoá nên giữ nguyên 100%. Xem
    # `prisma/reseed-testers.ts`. Cổng an toàn kép: input `reseed_testers` phải bật VÀ
    # `confirm_reseed_testers` phải gõ đúng "RESEED_TESTERS".
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed_testers == true && inputs.confirm_reseed_testers == 'RESEED_TESTERS' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reseed testers via SSH (cài tạm ts-node/typescript trong container rồi chạy reseed-testers.ts)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            CID=$(docker compose -f docker-compose.prod.yml ps -q api)
            docker exec "$CID" npm install --no-save ts-node typescript
            docker exec "$CID" npx ts-node --compiler-options '{"module":"commonjs"}' prisma/reseed-testers.ts

  patch-content:
    # An toàn tuyệt đối: KHÔNG có lệnh xoá/deleteMany nào trong patch-boost-and-lore.ts, chỉ INSERT
    # vật phẩm BOOST/streak_reward_days còn thiếu + UPDATE lore cho loài đang null — không cần cổng
    # xác nhận gõ chữ như 2 job reseed ở trên vì không có rủi ro mất dữ liệu (chạy lại nhiều lần vẫn
    # an toàn, tự bỏ qua phần đã có). Chạy job này SAU khi deploy image mới (đã có bảng
    # streak_reward_days + cột boostType/boostAmount từ migration) — thứ tự: build-and-push → deploy
    # → patch-content.
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_content == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch content via SSH (cài tạm ts-node/typescript trong container rồi chạy patch-boost-and-lore.ts)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            CID=$(docker compose -f docker-compose.prod.yml ps -q api)
            docker exec "$CID" npm install --no-save ts-node typescript
            docker exec "$CID" npx ts-node --compiler-options '{"module":"commonjs"}' prisma/patch-boost-and-lore.ts
